<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
  var form=document.getElementById('f'), err=document.getElementById('err'), busy=document.getElementById('busy'), box=document.getElementById('box'), btn=document.getElementById('btn');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.style.display='none'; busy.style.display='block'; btn.disabled=true;
    var pw=document.getElementById('pw').value;
    setTimeout(function(){
      crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(key){
        var ct=b64(P.c), tag=b64(P.t);
        var full=new Uint8Array(ct.length+tag.length); full.set(ct,0); full.set(tag,ct.length);
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,full);
      })
      .then(function(plain){
        var html=new TextDecoder().decode(plain);
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        busy.style.display='none'; btn.disabled=false; err.style.display='block';
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      });
    }, 30);
  });
})();
</script>
